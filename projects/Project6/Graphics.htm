<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Native Cooking of Utah - Graphics</title>

<style type="text/css">


	#thumbs, #image {
		width: 700px;
		text-align: center;
		margin: 0 auto 0 auto;
		color: #000;
	}

	#thumbs {
		margin-top: 10px;
	}

			
	#thumbs img {
		border: solid 1px #000;
		margin: 5px;
	}

	#image{
		height:400px;
	}

	.instructions{
		font-style:italic;
	}

</style>

<script language="JavaScript" type="text/javascript">

	print1 = new Image
	print2 = new Image
	logo1 = new Image
	logo2 = new Image
if (document.images) {
	print1.src = "Images/print1.jpg"
	print2.src = "Images/print2.jpg"
	logo1.src = "Images/logo1.jpg"
	logo2.src = "Images/logo2.jpg"
}


		var imgArray = new Array(
			'image1Lg.jpg',
			'image2Lg.jpg',
			'image3Lg.jpg',
			'image4Lg.jpg'
			

		);


		var titleArray = new Array(
			'Chef Enjoying Pasta',
			'Dutch Oven',
			'Cupcake',
			'Jello Cake'
			
		);
			
		var imgPath = "Images/fullsize/";
		
		function swapImage(imgID) {

			var theImage = document.getElementById('theImage');
			var textDiv = document.getElementById('bottomText');

			var newImg;
			var textTitle;

			newImg = imgArray[imgID];
			theImage.src = imgPath + newImg;

			textTitle=titleArray[imgID];

      			textDiv.innerHTML = textTitle;
		}
			
		function preloadImages() {		
			for(var i = 0; i < imgArray.length; i++) {
				var tmpImg = new Image;
				tmpImg.src = imgPath + imgArray[i];
			}
		}
		

</script>


</head>
<body  onload="preloadImages()">

<div align="center">

<div>
    <a href=""
       onmouseover="document.PrintButton.src=print2.src;"
       onmouseout="document.PrintButton.src=print1.src;">
        <img src="Images/print1.jpg" width="200" height="50" name="PrintButton" alt="Print Page" style="border:none;">
    </a>
</div>


<div id="logo">
	<a href="logo.html" onMouseOver="document.logo.src=logo2.src;"
	onMouseOut="document.logo.src=logo1.src;">

	<img src="images/logo1.jpg" width="133" height="126" 
	name="logo" alt="logo" style="border:none;"/>

	</a>
</div>

<br />
<br />
<br />
<br />


<div id="thumbs">
		<img src="Images/Thumbnails/image1Sm.jpg" alt="Chef Enjoying Pasta" onmouseover="swapImage(0);" />
		<img src="Images/Thumbnails/image2Sm.jpg" alt="Dutch Oven" onmouseover="swapImage(1);" />
		<img src="Images/Thumbnails/image3Sm.jpg" alt="Cupcake" onmouseover="swapImage(2);" />
		<img src="Images/Thumbnails/image4Sm.jpg" alt="Jello Cake" onmouseover="swapImage(3);" />
		
</div>

	<div id="image">

		<img id="theImage" src="Images/fullsize/image1Lg.jpg" alt="Chef Enjoying Pasta" />
		<h3 id="bottomText">Chef Enjoying Pasta</h3>
	</div>

<img src="Images/2colback.jpg" width="900" height="150">

<br />
<br />
<br />
<br />



</div>

<p>
    <a href="http://validator.w3.org/check?uri=referer"><img
      src="http://www.w3.org/Icons/valid-xhtml10" alt="Valid XHTML 1.0 Transitional" height="31" width="88" /></a>
</p>
  

</body>
</html>
